name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<<"$V"
          sed -i "0,/^version = \".*\"/s//version = \"$V\"/" Cargo.toml
          sed -i "s/android:versionName=\"[^\"]*\"/android:versionName=\"$V\"/; s/android:versionCode=\"[^\"]*\"/android:versionCode=\"$((MA*10000+MI*100+PA))\"/" android/app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "build-tools;36.1.0" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PROPS: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          test -n "$KS_B64" && test -n "$KS_PROPS" || { echo "Missing ANDROID_KEYSTORE_* secrets"; exit 1; }
          mkdir -p android/keystore
          echo "$KS_B64" | base64 -d > android/keystore/easyvpn-release.jks
          printf '%s\n' "$KS_PROPS" > android/keystore/keystore.properties
      - run: python3 tools/build_apk.py --abi arm64-v8a --release-name dist/EasyVpn-arm64.apk
      - run: python3 tools/build_apk.py --abi x86_64 --release-name dist/EasyVpn-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<<"$V"
          sed -i "0,/^version = \".*\"/s//version = \"$V\"/" Cargo.toml
          sed -i "s/android:versionName=\"[^\"]*\"/android:versionName=\"$V\"/; s/android:versionCode=\"[^\"]*\"/android:versionCode=\"$((MA*10000+MI*100+PA))\"/" android/app/src/main/AndroidManifest.xml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p easyvpn-gui -p easyvpn-cli
      - run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/easyvpn-gui.exe, target/release/easyvpn.exe out/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.exe

  release:
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" files/* --title "$GITHUB_REF_NAME" --notes "EasyVpn $GITHUB_REF_NAME"
          fi
