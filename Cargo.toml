[workspace]
resolver = "2"
members = [
    "crates/easyvpn-core",
    "crates/easyvpn-cli",
    "crates/easyvpn-gui",
    "crates/easyvpn-android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
easyvpn-core = { path = "crates/easyvpn-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
# Stock winit swallows the Android Back key; see vendor/winit/src/platform_impl/android/mod.rs
winit = { path = "vendor/winit" }
